site_name: "pre-commit-hooks"
site_url: "https://nolte.github.io/pre-commit-hooks/"
theme:
  name: material
docs_dir: docs/
repo_name: 'nolte/pre-commit-hooks'
repo_url: 'https://github.com/nolte/pre-commit-hooks'

nav:
  - Home: index.md
  - Getting Started: getting-started/index.md
  - Guides:
      - Overview: guides/index.md
      - Contributing: guides/contributing.md
  - References:
      - Overview: references/index.md
      - Hooks:
          - guard-primary-checkout: references/hooks/guard-primary-checkout.md
          - guard-spec-translation-sync: references/hooks/guard-spec-translation-sync.md
          - workflow-gate-integrity: references/hooks/workflow-gate-integrity.md
      - Governance and specs: references/governance.md

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: Startseite
            Getting Started: Erste Schritte
            Guides: Anleitungen
            Overview: Übersicht
            References: Referenzen
            Hooks: Hooks
            Contributing: Mitwirken
            Governance and specs: Governance und Specs
  - include-markdown

markdown_extensions:
  - pymdownx.inlinehilite:
  - pymdownx.superfences:
  - pymdownx.highlight:
  - toc:
      permalink: True
