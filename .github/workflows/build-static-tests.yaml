on:
  push:

jobs:
  static:
    uses: nolte/gh-plumbing/.github/workflows/reusable-pre-commit.yaml@d51e51ec3ec17ceea09fe9eb40ac00857b6fa1be # v2.0.0

  security:
    uses: nolte/gh-plumbing/.github/workflows/reusable-trivy.yaml@d51e51ec3ec17ceea09fe9eb40ac00857b6fa1be # v2.0.0
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

  chain-bench:
    uses: nolte/gh-plumbing/.github/workflows/reusable-chain-bench.yaml@d51e51ec3ec17ceea09fe9eb40ac00857b6fa1be # v2.0.0
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Run hook self-tests
        run: tests/test_guard-primary-checkout.sh

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'
      - name: Install docs dependencies
        run: pip install -r requirements-dev.txt
      - name: Build docs (strict)
        run: mkdocs build --strict
