on:
  push:

jobs:
  static:
    uses: nolte/gh-plumbing/.github/workflows/reusable-pre-commit.yaml@v2.0.0

  security:
    uses: nolte/gh-plumbing/.github/workflows/reusable-trivy.yaml@v2.0.0
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status

  chain-bench:
    uses: nolte/gh-plumbing/.github/workflows/reusable-chain-bench.yaml@v2.0.0
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      # workflow-gate-integrity needs a YAML parser; without it the hook exits 2
      # and this job goes red, rather than skipping the shapes silently.
      - name: Install hook runtime dependencies
        run: pip install PyYAML
      # Every suite under tests/, not a hand-maintained subset. This job used to
      # name one script, so the self-tests for the other two hooks never ran on a
      # pull request and a regression that removed a detector stayed green --
      # which is the defect class workflow-gate-integrity itself exists to refuse.
      - name: Run hook self-tests
        run: |
          set -euo pipefail
          for suite in tests/test_*.sh; do
            echo "::group::$suite"
            "$suite"
            echo "::endgroup::"
          done

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - name: Install docs dependencies
        run: pip install -r requirements-dev.txt
      - name: Build docs (strict)
        run: mkdocs build --strict
