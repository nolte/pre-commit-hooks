on:
  release:
    types: [published]
  # Manual fallback when the `release: published` event was emitted under
  # GITHUB_TOKEN — GitHub doesn't fire downstream workflows in that case
  # (Known Platform Constraint per spec/project/workflow-health/).
  workflow_dispatch:

jobs:
  refresh_presentation_branch:
    uses: nolte/gh-plumbing/.github/workflows/reusable-release-cd-refresh-master.yml@d51e51ec3ec17ceea09fe9eb40ac00857b6fa1be # v2.0.0
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    with:
      target_branch: main
