on:
  release:
    types: [published]
  # Manual fallback when the `release: published` event was emitted under
  # GITHUB_TOKEN — GitHub doesn't fire downstream workflows in that case
  # (Known Platform Constraint per spec/project/workflow-health/).
  workflow_dispatch:

jobs:
  refresh_presentation_branch:
    uses: nolte/gh-plumbing/.github/workflows/reusable-release-cd-refresh-master.yml@9048eafc8665611b8109e8c5a519b78e0fceffa6 # v2.2.1
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    with:
      target_branch: main
