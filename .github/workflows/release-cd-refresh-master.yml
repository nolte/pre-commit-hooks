on:
  release:
    types: [published]
  # Manual fallback when the `release: published` event was emitted under
  # GITHUB_TOKEN — GitHub doesn't fire downstream workflows in that case
  # (Known Platform Constraint per spec/project/workflow-health/).
  workflow_dispatch:

jobs:
  refresh_presentation_branch:
    uses: nolte/gh-plumbing/.github/workflows/reusable-release-cd-refresh-master.yml@d664e75afc4d57de958af926987f842c1fc1f420 # v2.3.1
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    with:
      target_branch: main
