---
name: Release Drafter

on:
  push:
    # branches to consider in the event; optional, defaults to all
    branches:
      - develop
  # Manual fallback when push-triggered runs miss commits — for example
  # because an automerge action used GITHUB_TOKEN, which doesn't fire
  # downstream workflows.
  workflow_dispatch:

jobs:
  update_release_draft:
    uses: nolte/gh-plumbing/.github/workflows/reusable-release-drafter.yml@d51e51ec3ec17ceea09fe9eb40ac00857b6fa1be # v2.0.0
    permissions:
      # write permission is required to create a github release
      contents: write
      # write permission is required for autolabeler
      # otherwise, read permission is required at least
      pull-requests: write
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
