# Reusable pre-commit hooks. Consume from a downstream .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/nolte/pre-commit-hooks
#       rev: v1.0.0
#       hooks:
#         - id: guard-primary-checkout
#
# See README.md for per-hook configuration (e.g. --branch).
- id: guard-primary-checkout
  name: primary checkout must stay on the integration branch
  description: >-
    Block commits made directly in the primary checkout while it sits on a
    feature branch. Feature work belongs in a dedicated git worktree.
    Configure the integration branch with `args: [--branch=main]` (default develop).
  entry: hooks/guard-primary-checkout.sh
  language: script
  always_run: true
  pass_filenames: false
  stages: [pre-commit]
- id: guard-spec-translation-sync
  name: spec translations must be staged together
  description: >-
    Block a commit that stages one language of a multilingual spec topic
    (spec/<topic>/<lang>.md) while leaving a tracked sibling translation
    unstaged. Configure the languages with `args: [--lang=en, --lang=de]`
    (default en de) and the spec root with `--spec-dir` (default spec).
  entry: hooks/guard-spec-translation-sync.sh
  language: script
  # always_run + pass_filenames:false: the hook derives its own staged set from
  # `git diff --cached`, so it must not be gated by a static `files` filter — a
  # `files: ^spec/...` regex would hard-code the root and silently disable the
  # `--spec-dir` override. Mirrors guard-primary-checkout's wiring.
  always_run: true
  pass_filenames: false
  stages: [pre-commit]
- id: workflow-gate-integrity
  name: no CI gate that cannot fail
  description: >-
    Refuse a GitHub Actions gate that cannot report a failure: a discarded exit
    code, `continue-on-error: true`, a job reading a dependency's outputs
    without its result, a comment truncating a continued command, or a file the
    workflow reads that its own `paths:` filter excludes. A site may stand by
    carrying a `# gate-integrity-ok: <reason>` comment. Configure the scanned
    directory with `args: [--scan-root=.github/workflows]` (the default).
  entry: hooks/workflow-gate-integrity.py
  # `language: script` runs the committed file directly, with pre-commit
  # resolving the path against this repository's clone. The check needs a YAML
  # parser for the two shapes that read parsed workflow structure, so it asks
  # for `python3` and `PyYAML` on the consumer's PATH rather than having
  # pre-commit build a managed environment — see Prerequisites in the README.
  # A missing parser fails the hook loudly; it never degrades to a partial scan.
  language: script
  # This hook fails CLOSED: unlike the two guards above it does not short-circuit
  # under `CI`. It checks CI configuration, and a gate that exempts itself from
  # CI would be the shape it exists to refuse. See CLAUDE.md §Module conventions.
  always_run: true
  pass_filenames: false
  stages: [pre-commit]
