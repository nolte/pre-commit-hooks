# Reusable pre-commit hooks. Consume from a downstream .pre-commit-config.yaml:
#
#   repos:
#     - repo: https://github.com/nolte/pre-commit-hooks
#       rev: v1.0.0
#       hooks:
#         - id: guard-primary-checkout
#
# See README.md for per-hook configuration (e.g. --branch).
- id: guard-primary-checkout
  name: primary checkout must stay on the integration branch
  description: >-
    Block commits made directly in the primary checkout while it sits on a
    feature branch. Feature work belongs in a dedicated git worktree.
    Configure the integration branch with `args: [--branch=main]` (default develop).
  entry: hooks/guard-primary-checkout.sh
  language: script
  always_run: true
  pass_filenames: false
  stages: [pre-commit]
- id: guard-spec-translation-sync
  name: spec translations must be staged together
  description: >-
    Block a commit that stages one language of a multilingual spec topic
    (spec/<topic>/<lang>.md) while leaving a tracked sibling translation
    unstaged. Configure the languages with `args: [--lang=en, --lang=de]`
    (default en de) and the spec root with `--spec-dir` (default spec).
  entry: hooks/guard-spec-translation-sync.sh
  language: script
  # always_run + pass_filenames:false: the hook derives its own staged set from
  # `git diff --cached`, so it must not be gated by a static `files` filter — a
  # `files: ^spec/...` regex would hard-code the root and silently disable the
  # `--spec-dir` override. Mirrors guard-primary-checkout's wiring.
  always_run: true
  pass_filenames: false
  stages: [pre-commit]
