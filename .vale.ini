StylesPath = ".github/styles"
MinAlertLevel = suggestion

Packages = Microsoft, RedHat, https://github.com/nolte/vale-style/releases/download/v0.1.3/nolte-styles.zip

IgnoredScopes = code,tt, em

# Two vocabularies: `technical` ships with the nolte/vale-style package (shared
# portfolio-wide dev terms — mkdocs, Taskfile, env, asdf, …); `pre-commit-hooks`
# holds terms specific to this repository. Prefer adding generic terms upstream
# in nolte/vale-style over the local vocab.
Vocab = technical, pre-commit-hooks

[*.md]
BasedOnStyles = Vale, Microsoft
# Disable the Microsoft number-range rules: in this repo "ranges" appear in
# YAML frontmatter dates (`last_updated: 2026-06-26`) and tool/library
# versions (`mkdocs==1.6.1`, `v1.1.18`), not in narrative prose.
Microsoft.Ranges = NO
Microsoft.RangeFormat = NO

# The German documentation track lives under docs/de/. The Microsoft style is
# English-only; running it against German prose produces noise without value.
# Vale.Spelling is English-only too, so we disable it for German prose and
# rely on the rendered output for review instead.
[docs/de/**/*.md]
BasedOnStyles = Vale
Vale.Spelling = NO
Vale.Terms = NO
Microsoft.Adverbs = NO
Microsoft.Avoid = NO
Microsoft.ComplexWords = NO
Microsoft.Contractions = NO
Microsoft.Dashes = NO
Microsoft.GeneralURL = NO
Microsoft.Headings = NO
Microsoft.Passive = NO
Microsoft.Ranges = NO
Microsoft.RangeFormat = NO
Microsoft.Semicolon = NO
Microsoft.Vocab = NO
Microsoft.Accessibility = NO
Microsoft.Wordiness = NO
Microsoft.Negative = NO
Microsoft.We = NO
Microsoft.Foreign = NO

# Multilingual specs under spec/<topic>/ are filename-keyed (en.md canonical,
# de.md the translation), unlike the directory-keyed docs/de/ track above. The
# German translation gets the same treatment: English-only spelling, terms, and
# Microsoft style produce noise on German prose, so disable them here too. The
# canonical spec/<topic>/en.md stays under the default [*.md] rules.
[spec/**/de.md]
BasedOnStyles = Vale
Vale.Spelling = NO
Vale.Terms = NO
Microsoft.Adverbs = NO
Microsoft.Avoid = NO
Microsoft.ComplexWords = NO
Microsoft.Contractions = NO
Microsoft.Dashes = NO
Microsoft.GeneralURL = NO
Microsoft.Headings = NO
Microsoft.Passive = NO
Microsoft.Ranges = NO
Microsoft.RangeFormat = NO
Microsoft.Semicolon = NO
Microsoft.Vocab = NO
Microsoft.Accessibility = NO
Microsoft.Wordiness = NO
Microsoft.Negative = NO
Microsoft.We = NO
Microsoft.Foreign = NO

[CLAUDE.md]
BasedOnStyles =

# Files under .claude/ are LLM-instruction artifacts (skills, agents), not
# published prose. They carry code-like jargon and intentional em-dashes; the
# prose styles don't apply. Lint them as the project-root CLAUDE.md above.
[.claude/**]
BasedOnStyles =
