---
version: '3'

includes:
  mkdocs: https://raw.githubusercontent.com/nolte/taskfiles/main/src/taskfile-include-mkdocs.yaml
  pre-commit: https://raw.githubusercontent.com/nolte/taskfiles/main/src/taskfile-include-pre-commit.yaml

tasks:
  default:
    cmds:
      - task -l
    silent: true

  test:
    desc: Run the hook self-tests
    cmds:
      - tests/test_guard-primary-checkout.sh
      - tests/test_guard-spec-translation-sync.sh
      - tests/test_workflow-gate-integrity.sh

  lint:
    desc: Run all pre-commit hooks
    cmds:
      - task: pre-commit:start

  docs:
    desc: Build the mkdocs site with the same strict gate CI runs
    cmds:
      - mkdocs build --strict

  docs:serve:
    desc: Serve the mkdocs site locally for preview
    cmds:
      - task: mkdocs:start
